name: Publicar espejo incba.cl

# incba.com.ar se sirve desde este repo. incba.cl necesita un repo aparte
# porque GitHub Pages admite un solo dominio por sitio (responde 404 a
# cualquier Host que no coincida con el CNAME). Este workflow deriva la
# versión chilena desde index.html y la publica en INCBA/incba-web-cl,
# así el contenido de ambos dominios sale siempre de la misma fuente.

# EN PAUSA desde el 2026-09-25: sólo se corre a mano.
# Ese día incba.com.ar pasó a la portada nueva (la "opción B") e incba.cl se
# quedó a propósito con la versión anterior: va a tener su propia versión
# chilena, con otra historia, más adelante. tools/build-cl.mjs busca textos
# exactos de la portada VIEJA y falla contra la nueva, así que dispararlo en
# cada push sólo produciría builds rotos. Mientras tanto incba.cl sigue
# sirviendo lo último que se publicó en INCBA/incba-web-cl.
# Para reactivarlo: reescribir las RULES de tools/build-cl.mjs contra la
# portada chilena y volver a poner el disparador de push a master.
on:
  workflow_dispatch:

concurrency:
  group: deploy-cl
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # El runner ya trae Node y el script no usa dependencias.
      - name: Generar sitio chileno
        run: node tools/build-cl.mjs

      - name: Publicar en incba-web-cl
        env:
          DEPLOY_KEY: ${{ secrets.CL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

          cd dist-cl
          git init -q -b master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Espejo de incba-web@${GITHUB_SHA::7}"
          git remote add origin git@github.com:INCBA/incba-web-cl.git
          git push -q --force origin master
